name: strix-web
services:
  app:
    image: strix-service:0.2.1
    command: all
    restart: unless-stopped
    network_mode: host
    stop_grace_period: 50s
    environment:
      STRIX_DATA_DIR: /srv/strix-data
      WEB_CONFIG_REQUIRED: 'true'
      EGRESS_POLICY_ACK: ${EGRESS_POLICY_ACK:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      STRIX_IMAGE: ghcr.io/usestrix/strix-sandbox:1.3.0
    volumes:
      - /srv/strix-data:/srv/strix-data
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 3g
    cpus: 3
    logging:
      options: {max-size: 10m, max-file: '3'}
