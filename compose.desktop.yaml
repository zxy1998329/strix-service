name: strix-local
services:
  api:
    image: strix-service:local
    build: .
    command: api
    restart: unless-stopped
    ports: ['127.0.0.1:8080:8080']
    environment: &settings
      STRIX_DATA_DIR: /var/lib/docker/volumes/strix-local-data/_data
      WEB_CONFIG_REQUIRED: 'true'
      EGRESS_POLICY_ACK: 'true'
      STRIX_DOCKER_SANDBOX_NETWORK: strix-local-sandbox
      STRIX_IMAGE: ghcr.io/usestrix/strix-sandbox:1.3.0
      ALLOWED_TARGET_HOSTS: 172.30.88.10
      ALLOWED_TARGET_CIDRS: 172.30.88.10/32
      ALLOWED_TARGET_PORTS: '8765'
    volumes:
      - data:/var/lib/docker/volumes/strix-local-data/_data
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      options: {max-size: 10m, max-file: '3'}
  worker:
    image: strix-service:local
    command: worker
    restart: unless-stopped
    network_mode: host
    stop_grace_period: 45s
    environment: *settings
    volumes:
      - data:/var/lib/docker/volumes/strix-local-data/_data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      api:
        condition: service_healthy
    logging:
      options: {max-size: 10m, max-file: '3'}
  demo:
    image: strix-service:local
    command: [python, /fixture/serve.py]
    restart: unless-stopped
    volumes:
      - ./local-demo:/fixture:ro
    networks:
      sandbox:
        ipv4_address: 172.30.88.10
volumes:
  data:
    name: strix-local-data
networks:
  sandbox:
    name: strix-local-sandbox
    internal: true
    ipam:
      config:
        - subnet: 172.30.88.0/24
